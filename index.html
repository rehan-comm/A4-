<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Portfolio Dashboard</title>
    
</head>

<body>
    <main class="portfolio">
        <aside class="profile">
            <div class="profile-label">✿ &nbsp; About Me</div>

            <div class="profile-card">
                <div class="side-menu">
                    <span>Clients</span>
                    <span>Research</span>
                    <span>Portfolio</span>
                    <span>Podcast</span>
                </div>

                <img class="profile-image" src="profile.png" alt="Portrait">

                <div class="profile-content">
                    <p class="intro">I'm,</p>
                    <h2 class="name">Jon<br>Daniel</h2>
                    <p class="email">inquiry@jondaniel.design ✉</p>
                </div>

                <div class="profile-stamp">GOOD<br>DESIGN<br>PORTFOLIO</div>
            </div>
        </aside>

        <section class="main-content">
            <h1 class="page-title">Portfolio</h1>

            <div class="feature">
                <img src="feature.jpg" alt="Flamingo illustration">
                <div class="play-button">▶</div>
            </div>

            <div class="stats">
                <div class="stat stat-projects">
                    <strong class="stat-number">251</strong>
                    <span class="stat-label">Projects</span>
                </div>

                <div class="stat stat-awards">
                    <strong class="stat-number">156</strong>
                    <span class="stat-label">Awards</span>
                </div>
            </div>

            <div class="bottom-grid">
                <div class="clients">
                    <span class="apple">●</span>
                    <p>Clients</p>
                </div>

                <div class="award-card">
                    <div class="artwork">
                        <img src="artwork.png" alt="3D abstract artwork">
                    </div>

                    <div class="global-award">
                        <strong>172</strong>
                        <p>Global Design<br>Awards.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
